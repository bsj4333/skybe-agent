[project]
name = "skive-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.121.2",
    "fpdf2>=2.8.8",
    "httpx>=0.28.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "psycopg[binary]>=3.2.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # skive/ 는 빌드 패키지(src/skive_practice)가 아니라 리포 루트에 있다

[project.scripts]
skive-practice = "skive_practice:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
