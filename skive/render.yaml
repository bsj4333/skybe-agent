# Render Blueprint. When creating it, set the Blueprint path to skive/render.yaml.
# Values marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: skive
    runtime: docker
    plan: free  # Sleeps after 15 idle minutes; extraction pauses until the next request.
    region: singapore
    branch: skive-agent
    rootDir: skive
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/drive/config
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN_KEY
        sync: false
      - key: SKIVE_PUBLIC_URL
        value: https://skive.onrender.com
